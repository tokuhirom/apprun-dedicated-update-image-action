name: 'AppRun Dedicated Update Image'
description: 'Updates AppRun Dedicated application image by creating and activating a new version'
author: 'tokuhirom'

inputs:
  applicationID:
    description: 'Application ID (UUID). Multiple IDs can be specified separated by commas. Either applicationID or applicationName is required.'
    required: false
  applicationName:
    description: 'Application name. Multiple names can be specified separated by commas. Either applicationID or applicationName is required.'
    required: false
  sakuraAccessToken:
    description: 'Sakura Access Token (UUID)'
    required: true
  sakuraAccessTokenSecret:
    description: 'Sakura Access Token Secret'
    required: true
  image:
    description: 'New container image name (e.g., nginx:latest)'
    required: true
  activate:
    description: 'Whether to activate the new version immediately (default: true)'
    required: false
    default: 'true'

outputs:
  applicationNames:
    description: 'The application name(s) that were updated. Comma-separated if multiple applications were updated.'
  version:
    description: 'The newly created version number(s). Comma-separated if multiple applications were updated.'
  activeVersion:
    description: 'The activated version number(s). Comma-separated if multiple applications were updated. (same as version if activate=true, otherwise the previously active version)'

runs:
  using: 'node20'
  main: 'dist/index.js'
